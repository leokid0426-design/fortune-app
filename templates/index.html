<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 운세 & 별자리</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 1.05em;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-container {
            margin-top: 30px;
            display: none;
        }

        .result-container.show {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #667eea;
            line-height: 1.8;
            color: #333;
            font-size: 1.05em;
        }

        .result-title {
            font-size: 1.3em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background-color: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ 나의 운세 & 별자리</h1>
            <p>오늘의 운세를 만나보세요!</p>
        </div>

        <form id="fortuneForm">
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" placeholder="이름을 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="birthDate">생년월일</label>
                <input type="date" id="birthDate" name="birth_date" required>
            </div>

            <div class="form-group">
                <label for="zodiac">별자리</label>
                <select id="zodiac" name="zodiac" required>
                    <option value="">별자리를 선택하세요</option>
                    <option value="양자리">♈ 양자리 (3/21 ~ 4/19)</option>
                    <option value="황소자리">♉ 황소자리 (4/20 ~ 5/20)</option>
                    <option value="쌍둥이자리">♊ 쌍둥이자리 (5/21 ~ 6/20)</option>
                    <option value="게자리">♋ 게자리 (6/21 ~ 7/22)</option>
                    <option value="사자리">♌ 사자리 (7/23 ~ 8/22)</option>
                    <option value="처녀자리">♍ 처녀자리 (8/23 ~ 9/22)</option>
                    <option value="천칭자리">♎ 천칭자리 (9/23 ~ 10/22)</option>
                    <option value="전갈자리">♏ 전갈자리 (10/23 ~ 11/21)</option>
                    <option value="사수자리">♐ 사수자리 (11/22 ~ 12/21)</option>
                    <option value="염소자리">♑ 염소자리 (12/22 ~ 1/19)</option>
                    <option value="물병자리">♒ 물병자리 (1/20 ~ 2/18)</option>
                    <option value="물고기자리">♓ 물고기자리 (2/19 ~ 3/20)</option>
                </select>
            </div>

            <button type="submit">🔮 운세보기</button>
        </form>

        <div class="error" id="errorMessage"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>당신의 운세를 불러오는 중...</p>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-title">🌟 오늘의 운세</div>
            <div class="result" id="fortuneResult"></div>
        </div>
    </div>

    <script>
        document.getElementById("fortuneForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const birthDate = document.getElementById("birthDate").value;
            const zodiac = document.getElementById("zodiac").value;
            const errorElement = document.getElementById("errorMessage");
            const loadingElement = document.getElementById("loading");
            const resultContainer = document.getElementById("resultContainer");

            errorElement.classList.remove("show");
            loadingElement.classList.add("show");
            resultContainer.classList.remove("show");

            try {
                const response = await fetch("/get_fortune", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: name,
                        birth_date: birthDate,
                        zodiac: zodiac
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "오류가 발생했습니다.");
                }

                const data = await response.json();
                loadingElement.classList.remove("show");
                document.getElementById("fortuneResult").textContent = data.fortune;
                resultContainer.classList.add("show");
            } catch (error) {
                loadingElement.classList.remove("show");
                errorElement.textContent = error.message;
                errorElement.classList.add("show");
            }
        });
    </script>
</body>
</html>
